# ─────────────────────────────────────────────────────────────────────────────
# OuchTracker — Development Docker Compose
#
# Services:
#   db       — PostgreSQL 16 (persisted via named volume)
#   backend  — NestJS in watch mode (hot-reload via ts-node + chokidar)
#   frontend — Quasar PWA Dev Server with HMR (quasar dev -m pwa)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

name: ouchtracker-dev

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ouchtracker-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ouchtracker
      POSTGRES_PASSWORD: ouchtracker_dev_pass
      POSTGRES_DB: ouchtracker_db
    ports:
      - "5432:5432"     # expose to host so you can run prisma migrate from the CLI
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouchtracker -d ouchtracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend (watch mode) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ouchtracker-backend-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ouchtracker:ouchtracker_dev_pass@db:5432/ouchtracker_db?schema=public
      CORS_ORIGIN: http://localhost:9000
      JWT_SECRET: dev_jwt_secret_change_in_prod
      JWT_EXPIRES_IN: 8h
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ouchtracker.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin1234!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Admin}
      # Optional SSO for local testing, e.g. OIDC_ENABLED=true OIDC_ISSUER=… docker compose … up
      # In dev the API is on :3000, so register http://localhost:3000/api/auth/oidc/callback
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/oidc/callback}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-authentik}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      APP_URL: http://localhost:9000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src              # live-reload source
      - ./backend/prisma:/app/prisma        # schema & migrations
      - /app/node_modules                   # keep container's node_modules

  # ── Quasar Frontend (HMR) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ouchtracker-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "9000:9000"
    volumes:
      - ./frontend/src:/app/src             # live-reload source
      - ./frontend/src-pwa:/app/src-pwa     # PWA manifest & service worker
      - ./frontend/public:/app/public
      - /app/node_modules                   # keep container's node_modules

volumes:
  postgres_dev_data:
