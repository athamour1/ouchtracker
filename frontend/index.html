<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <!-- Runtime config — API URL injected by the container entrypoint -->
    <script src="/config.js"></script>
    <!--
      Front-channel Single Logout — runs IMMEDIATELY, before the app boots.

      Authentik loads /auth/frontchannel-logout in a short-lived hidden iframe;
      the heavy PWA boot (lazy route chunk + mount) does not finish in time. So
      we clear the local session and raise the cross-tab signal here, inline. Open
      tabs listen for it (storage event) and log out — see boot/sso-sync.ts.
    -->
    <script>
      (function () {
        try {
          if (location.pathname === '/auth/frontchannel-logout') {
            ['access_token', 'user', 'refresh_token', 'refresh_user_id', 'ouchtracker:sso'].forEach(
              function (k) { localStorage.removeItem(k); },
            );
            localStorage.setItem('ouchtracker:slo', String(Date.now()));
          }
        } catch (e) {
          /* private browsing */
        }
      })();
    </script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
