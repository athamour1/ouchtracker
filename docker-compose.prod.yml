# ─────────────────────────────────────────────────────────────────────────────
# OuchTracker — Production Docker Compose
#
# Uses pre-built images published to GitHub Container Registry by release.sh.
# Images: ghcr.io/athamour1/ouchtracker/backend  (tagged :latest or :vX.Y.Z)
#         ghcr.io/athamour1/ouchtracker/frontend  (tagged :latest or :vX.Y.Z)
#
# Services:
#   db       — PostgreSQL 16 (persisted via named volume, no host port exposed)
#   backend  — NestJS compiled image from GHCR, runs migrations on startup
#   frontend — Quasar PWA + nginx image from GHCR, proxies /api → backend
#
# Before first run:
#   1. Copy .env.prod.example → .env.prod and fill in secrets
#   2. Optionally set IMAGE_TAG in .env.prod (default: latest)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# To deploy a specific release:
#   IMAGE_TAG=v1.2.0 docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# The --env-file flag is required so Compose can interpolate ${VAR} placeholders.
# The env_file key on each service injects those same vars into the containers.
#
# The only public-facing port is 80 (frontend + API proxy).
# ─────────────────────────────────────────────────────────────────────────────

name: ouchtracker-prod

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ouchtracker-db
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # db port is NOT exposed to the host in production

  # ── NestJS Backend ────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/athamour1/ouchtracker/backend:${IMAGE_TAG:-latest}
    container_name: ouchtracker-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ouchtracker.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Admin}
      # Optional single sign-on (authentik / any OIDC provider) — see .env.prod.example
      APP_URL: ${APP_URL:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_AUTO_CREATE_USERS: ${OIDC_AUTO_CREATE_USERS:-true}
      LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-true}
    # backend port is NOT exposed to the host — nginx proxies through Docker network
    expose:
      - "3000"

  # ── Nginx + Quasar PWA ───────────────────────────────────────────────────
  frontend:
    image: ghcr.io/athamour1/ouchtracker/frontend:${IMAGE_TAG:-latest}
    container_name: ouchtracker-frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env.prod
    environment:
      # Runtime — written into /config.js by docker-entrypoint.sh each time
      # the container starts. Change without rebuilding the image.
      # Use /api (relative) when nginx proxies on the same domain, or set a
      # full URL like https://api.your-domain.com/api for split deployments.
      API_URL: ${API_URL:-/api}
    ports:
      - "80:80"

volumes:
  postgres_prod_data:
